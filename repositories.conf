#
# Pkgain repositories list
#
# One repository per line, either:
#
#   url
# or:
#   alias url
#
# Aliases are optional and allow packages to be selected from a specific
# repository, e.g. "pkgain in xterm/repo2".  Alias names must not contain
# '/' or '=' characters.  Repositories listed without an alias act as the
# default, and the first of them can also be selected explicitly with the
# special alias "default", e.g. "pkgain in xterm/default".
#
# WARNING: if a package is available from several repositories at the
# same version, it is fetched from the "default" repository (the first
# one listed without an alias).  Otherwise order matters, and the
# package is fetched from the first repository listed in this file.
#
# This file format supports the following macros in the repository url:
# $arch to define the machine hardware platform
# $osrelease to define the release version for the operating system
#
# Remote ftp repository
#
# ftp://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/$arch/5.1/All
#
# Remote http repository
#
# http://mirror-master.dragonflybsd.org/packages/$arch/DragonFly-$osrelease/stable/All
#
# Local repository (must contain a pkg_summary.gz or bz2)
#
# file:///usr/pkgsrc/packages/All
#
# Named local repository
#
# local file:///usr/pkgsrc/packages/All
